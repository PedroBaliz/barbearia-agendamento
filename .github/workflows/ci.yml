name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: chave-somente-para-ci
      DEBUG: "false"
      DATABASE_URL: postgresql://barbearia:barbearia@localhost:5432/barbearia
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: barbearia
          POSTGRES_PASSWORD: barbearia
          POSTGRES_DB: barbearia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U barbearia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations em dia
        run: python src/manage.py makemigrations --check --dry-run
      - name: Testes e cobertura (RNF04 ≥ 60%)
        run: pytest

  migrations-producao:
    # Na Vercel não há etapa de pré-deploy: as migrations rodam aqui a cada merge na main.
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCAO }}
      SECRET_KEY: ${{ secrets.SECRET_KEY_PRODUCAO }}
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Aplicar migrations no banco de produção
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Secret DATABASE_URL_PRODUCAO não configurado; migrations não aplicadas."
            exit 0
          fi
          python src/manage.py migrate --noinput
