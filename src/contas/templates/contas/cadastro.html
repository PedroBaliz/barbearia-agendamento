{% extends "base.html" %}

{% block titulo %}Criar conta · BarberBook{% endblock %}

{% block conteudo %}
<div class="text-center mb-4">
  <span class="bb-logo">B</span>
  <h1 class="h2 fw-bold mt-3 mb-0">Criar conta</h1>
  <p class="text-secondary">Cadastre-se para agendar seu horário</p>
</div>

<form method="post" class="bb-cartao p-4 mb-3" novalidate>
  {% csrf_token %}
  {% for campo in form %}
  {% include "partials/campo.html" %}
  {% endfor %}
  <button type="submit" class="btn btn-bb w-100 py-2">Criar conta</button>
</form>

<p class="text-center text-secondary mb-0">Já tem conta? <a class="text-bb" href="{% url 'entrar' %}">Entrar</a></p>
{% endblock %}
