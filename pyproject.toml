[project]
name = "barbearia-agendamento"
version = "0.1.0"
requires-python = ">=3.12"
# Mantido igual ao requirements.txt (a Vercel instala pelo pyproject)
dependencies = [
    "Django==5.2.19",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.9",
    "whitenoise==6.12.0",
    "python-dotenv==1.2.4",
    "bcrypt==5.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
omit = ["src/manage.py", "src/config/asgi.py", "src/config/wsgi.py", "*/migrations/*"]

[tool.coverage.report]
# RNF04: cobertura mínima de 60%
fail_under = 60

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
